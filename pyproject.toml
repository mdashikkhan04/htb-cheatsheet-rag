[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htbrag"
version = "1.0.0"
description = "HTB Cheatsheet Assistant (RAG) — grounded, cited answers over HTB write-ups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39", "openai>=1.40"]        # real LLM synthesis
dense = ["sentence-transformers>=2.2"]           # neural dense retrieval

[project.scripts]
htbrag = "htbrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
